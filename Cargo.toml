[package]
name = "neroa-compatible-adaptive-bridge"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Renderer-independent adaptive web compatibility bridge for the Neroa spatial browser."

[dependencies]
async-trait = "0.1"
glam = "0.30"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }