[package]
name = "neroa-compatible-adaptive-bridge"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Renderer-independent adaptive web compatibility bridge for the Neroa spatial browser."

[features]
default = []
chromium-runtime = []
servo-runtime = [
    "dep:embedder_traits",
    "dep:euclid",
    "dep:rustls",
    "dep:servo",
    "dep:webrender_api",
    "dep:winit",
]

# NEROA_OAUTH_LOOPBACK_V11
#
# Loopback OAuth (RFC 8252). Uses the HTTP/TLS stack Servo already pulls in,
# so it adds no heavy new dependency; kept behind a feature so a build that
# only wants the bridge does not compile a web client.
# NEROA_ROS_CLIENT_V14: the Receipt OS client shares the same http stack.
ros = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:hyper-rustls",
    "dep:rustls",
]

oauth = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:hyper-rustls",
    "dep:rustls",
    "dep:base64",
    "dep:rand",
]

[dependencies]
async-trait = "0.1"
glam = "0.30"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Real Servo integration is deliberately optional until the native host is
# proven on every platform. Default bridge/JIT tests stay lightweight.
embedder_traits = { package = "servo-embedder-traits", version = "=0.5.0", optional = true }
euclid = { version = "0.22", optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"], optional = true }

# NEROA_OAUTH_LOOPBACK_V11: already present transitively via Servo, pinned
# here so the oauth feature compiles standalone.
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "webpki-roots"], optional = true }
base64 = { version = "0.22", optional = true }
# NEROA_TRAINING_RECEIPTS_V13 + oauth both need sha2; always compiled.
sha2 = { version = "0.10" }
rand = { version = "0.9", optional = true }
# The published crates.io package does not expose Servo's workspace-only
# `bundled` convenience alias. Reproduce it explicitly with its published
# component features. `js_jit` is important here: without it mozjs_sys forces
# a local SpiderMonkey source build on Windows and requires MozTools/LLVM.
webrender_api = { version = "0.70", optional = true }
winit = { version = "0.30.13", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "servo-smoke"
path = "src/bin/servo_smoke.rs"
required-features = ["servo-runtime"]

# Servo rendering backend selection is platform-specific.
# Windows retains the proven ANGLE/no-wgl path.
# Linux must not enable mozangle/egl because mozangle 0.6.0 does not
# provide that EGL build path on non-Windows targets.
[target.'cfg(windows)'.dependencies]
servo = { version = "=0.5.0", default-features = false, features = ["baked-in-resources", "bundled_freetype", "js_jit", "no-wgl"], optional = true }

[target.'cfg(not(windows))'.dependencies]
servo = { version = "=0.5.0", default-features = false, features = ["baked-in-resources", "bundled_freetype", "js_jit"], optional = true }

